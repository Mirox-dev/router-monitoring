[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "router-monitor-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["aiogram>=3.15,<4", "asyncpg>=0.30,<1", "pydantic-settings>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/router_monitor_bot"]
