x-cloudflared-access-common: &cloudflared-access-common
  image: cloudflare/cloudflared:2026.10.7
  profiles: [monitoring]
  restart: unless-stopped
  depends_on: [router_monitor]
  network_mode: "service:router_monitor"
  env_file:
    - ./secrets/cloudflare-access.env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: router_monitor
      POSTGRES_PASSWORD: ${ROUTER_MONITOR_POSTGRES_PASSWORD:?ROUTER_MONITOR_POSTGRES_PASSWORD is required}
      POSTGRES_DB: router_monitor
    volumes:
      - router_monitor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router_monitor -d router_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monitoring]

  router_monitor:
    build: ./router-monitor
    profiles: [monitoring]
    user: "10001:0"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      ROUTER_MONITOR_DATABASE_URL: postgresql+psycopg://router_monitor:${ROUTER_MONITOR_POSTGRES_PASSWORD}@postgres:5432/router_monitor
      ROUTER_MONITOR_INVENTORY: /etc/router-monitor/inventory.yml
      ROUTER_MONITOR_SSH_CLIENT_KEYS: /run/secrets/router-monitor-key
      ROUTER_MONITOR_SSH_KNOWN_HOSTS: /run/secrets/known_hosts
      USER: root
      LOGNAME: root
    volumes:
      - ./router-monitor/config/inventory.example.yml:/etc/router-monitor/inventory.yml:ro
      - ./secrets/router-monitor-key:/run/secrets/router-monitor-key:ro
      - ./secrets/known_hosts:/run/secrets/known_hosts:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [monitoring]

  cloudflared_access_2201:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2201.balaganet.online", "--url", "127.0.0.1:2201"]

  cloudflared_access_2202:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2202.balaganet.online", "--url", "127.0.0.1:2202"]

  cloudflared_access_2203:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2203.balaganet.online", "--url", "127.0.0.1:2203"]

  cloudflared_access_2204:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2204.balaganet.online", "--url", "127.0.0.1:2204"]

  cloudflared_access_2205:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2205.balaganet.online", "--url", "127.0.0.1:2205"]

  cloudflared_access_2206:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2206.balaganet.online", "--url", "127.0.0.1:2206"]

  cloudflared_access_2207:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2207.balaganet.online", "--url", "127.0.0.1:2207"]

  cloudflared_access_2208:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2208.balaganet.online", "--url", "127.0.0.1:2208"]

  cloudflared_access_2209:
    <<: *cloudflared-access-common
    command: ["access", "tcp", "--hostname", "router-2209.balaganet.online", "--url", "127.0.0.1:2209"]

  telegram_bot:
    build: ./telegram-bot
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      ROUTER_MONITOR_BOT_TOKEN: ${ROUTER_MONITOR_BOT_TOKEN:?ROUTER_MONITOR_BOT_TOKEN is required}
      ROUTER_MONITOR_ADMIN_IDS: ${ROUTER_MONITOR_ADMIN_IDS:?ROUTER_MONITOR_ADMIN_IDS is required}
      ROUTER_MONITOR_ALERT_CHAT_ID: ${ROUTER_MONITOR_ALERT_CHAT_ID:?ROUTER_MONITOR_ALERT_CHAT_ID is required}
      ROUTER_MONITOR_DATABASE_URL: postgresql://router_monitor:${ROUTER_MONITOR_POSTGRES_PASSWORD}@postgres:5432/router_monitor
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [monitoring]

volumes:
  router_monitor_postgres:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
