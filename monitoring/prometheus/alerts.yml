groups:
  - name: router-health
    interval: 30s
    rules:
      - alert: RouterTransportDown
        expr: avg_over_time(router_transport_ok[5m]) < 0.2
        for: 2m
        keep_firing_for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Reverse SSH transport is down"
      - alert: RouterTelemetryUnavailable
        expr: router_transport_ok == 1 and avg_over_time(router_collection_ok[5m]) < 0.2
        for: 5m
        keep_firing_for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Router is reachable, but telemetry collection is failing"
      - alert: RouterEgressCheckUnavailable
        expr: router_transport_ok == 1 and avg_over_time(router_collection_ok[5m]) > 0.8 and avg_over_time(router_egress_check_ok[5m]) < 0.2
        for: 5m
        keep_firing_for: 5m
        labels: {severity: warning}
        annotations:
          summary: "External IP checks are unavailable"
      - alert: RouterForeignEgressDown
        expr: router_egress_check_ok == 1 and avg_over_time(router_vpn_ok[5m]) < 0.2
        for: 2m
        keep_firing_for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Router has no foreign egress IP"
      - alert: RouterLoadHigh
        expr: router_load1 > 4
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Router load average is high"
