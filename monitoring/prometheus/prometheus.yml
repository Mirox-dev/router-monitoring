global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: router-monitor
    static_configs:
      - targets: [router_monitor:9108]

rule_files:
  - /etc/prometheus/alerts.yml
